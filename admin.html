<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Invitados · Mis 15 Carla</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(160deg,#14052b,#3e1570);color:#f6ecff;min-height:100vh;padding:16px}
.w{max-width:760px;margin:0 auto}h1{font-size:1.3rem;margin:0 0 12px}
.box{background:rgba(255,255,255,.08);border:1px solid rgba(255,217,138,.4);border-radius:16px;padding:14px;margin-bottom:14px}
input,select,textarea{width:100%;padding:12px;margin:0 0 8px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font:16px system-ui}
button{padding:11px 16px;border:0;border-radius:99px;font:600 .9rem system-ui;cursor:pointer;background:linear-gradient(135deg,#fff1c7,#ffd98a);color:#2b0b4d}
button.g{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,217,138,.6)}
.cnt{display:flex;gap:10px;margin-bottom:14px}.cnt div{flex:1;text-align:center;padding:12px;border-radius:14px;background:rgba(0,0,0,.3)}.cnt b{display:block;font-size:1.6rem;color:#ffd98a}
.r{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0;border-top:1px solid rgba(255,255,255,.12)}
.r>div{flex:1;min-width:150px}.r small{display:block;color:#d9c2f0}
.chip{padding:4px 12px;border-radius:99px;font-size:.78rem;background:rgba(255,255,255,.15)}.chip.ok{background:#1f9d55;color:#fff}
.err{color:#ffb4c8;min-height:1.2em}.top{display:flex;justify-content:space-between;align-items:center}
</style></head><body><div class="w" id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
firebase.initializeApp(CFG.firebase);var auth=firebase.auth(),db=firebase.firestore(),$=function(i){return document.getElementById(i)},docs=[],unsub=null;
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
async function sha(s){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(CFG.salt+s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}
function tok(){var a=new Uint8Array(16);crypto.getRandomValues(a);return Array.from(a).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}
function now(){return new Date().toLocaleString('es-AR',{dateStyle:'short',timeStyle:'short'})}
auth.onAuthStateChanged(function(u){if(unsub){unsub();unsub=null}u?panel(u):login()});
function login(){$('app').innerHTML='<h1>🔐 Administrar invitados</h1><form class="box" id="lf"><input id="em" type="email" placeholder="Correo" autocomplete="username"><input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password"><p class="err" id="er"></p><button>Entrar</button></form>';
  $('lf').onsubmit=function(e){e.preventDefault();auth.signInWithEmailAndPassword($('em').value.trim(),$('pw').value).catch(function(){$('er').textContent='Correo o contraseña incorrectos'})}}
function panel(u){$('app').innerHTML='<div class="top"><h1>💜 Invitados · Mis 15 Carla</h1><button class="g" id="out">Salir</button></div><div class="cnt"><div><b id="c1">0</b>Familias</div><div><b id="c2">0</b>Amigos</div><div><b id="c3">0</b>Amigos presentes</div></div>'+
 '<div class="box"><b>Agregar invitado</b><input id="n" placeholder="Nombre (ej: Familia Duarte o Ana Pérez)"><input id="d" inputmode="numeric" placeholder="DNI"><select id="a"><option value="F">Familia (varios, sin vencimiento)</option><option value="A">Amigo (se canjea una sola vez)</option></select><p class="err" id="e1"></p><button id="add">Agregar</button></div>'+
 '<div class="box"><b>Importar lista</b><small style="display:block;margin:4px 0 8px;color:#d9c2f0">Una por línea: Nombre; DNI; F (familia) o A (amigo)</small><textarea id="imp" rows="4" placeholder="Familia Duarte; 30111222; F"></textarea><p class="err" id="e2"></p><button id="go">Importar</button></div>'+
 '<div class="box"><input id="q" placeholder="🔍 Buscar por nombre"><div id="ls"></div></div>';
 $('out').onclick=function(){auth.signOut()};$('q').oninput=draw;
 $('add').onclick=async function(){var r=await addOne($('n').value,$('d').value,$('a').value);$('e1').textContent=r||'';if(!r){$('n').value=$('d').value=''}};
 $('go').onclick=async function(){var L=$('imp').value.split('\n').filter(function(x){return x.trim()}),ok=0,bad=[];
  for(var i=0;i<L.length;i++){var p=L[i].split(/[;\t,]/),r=await addOne(p[0]||'',p[1]||'',p[2]||'A');if(r)bad.push((i+1)+': '+r);else ok++}
  $('e2').textContent='Agregados: '+ok+(bad.length?' · Con problemas → '+bad.join(' | '):'');if(!bad.length)$('imp').value=''};
 unsub=db.collection('pases').orderBy('nombre').onSnapshot(function(s){docs=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});draw()},function(e){$('ls').textContent='Sin permiso para ver la lista ('+e.code+')'})}
async function addOne(n,d,a){n=n.trim().replace(/\s+/g,' ');d=d.replace(/\D/g,'');var tp=/^f/i.test(String(a).trim())?'F':'A';
  if(!n)return'Falta el nombre';if(d.length<7)return'DNI inválido';
  try{var h=await sha(d);if((await db.collection('dni').doc(h).get()).exists)return'Ese DNI ya está en la lista';
   var t=tok(),b=db.batch();b.set(db.collection('pases').doc(t),{nombre:n,tipo:tp,h:h,presente:false,hora:''});b.set(db.collection('dni').doc(h),{t:t});await b.commit();return''}catch(e){return'Error: '+e.code}}
function draw(){var q=($('q').value||'').toLowerCase(),L=docs.filter(function(x){return x.nombre.toLowerCase().indexOf(q)>-1}),F=docs.filter(function(x){return x.tipo==='F'}),A=docs.filter(function(x){return x.tipo!=='F'});
 $('c1').textContent=F.length;$('c2').textContent=A.length;$('c3').textContent=A.filter(function(x){return x.presente}).length;
 $('ls').innerHTML=L.map(function(x){var f=x.tipo==='F';return'<div class="r"><div><b>'+esc(x.nombre)+'</b><small>'+(f?'Familia · sin vencimiento':'Amigo · una sola vez')+'</small></div>'+(f?'':'<span class="chip'+(x.presente?' ok':'')+'">'+(x.presente?'Presente '+esc(x.hora):'Pendiente')+'</span><button class="g" data-a="t" data-i="'+x.id+'">'+(x.presente?'Quitar presente':'Marcar presente')+'</button>')+'<button class="g" data-a="c" data-i="'+x.id+'">🔗</button><button class="g" data-a="x" data-i="'+x.id+'">🗑</button></div>'}).join('')||'<small>No hay invitados todavía</small>'}
document.addEventListener('click',async function(e){var t=e.target.closest('[data-a]');if(!t)return;var id=t.dataset.i,x=docs.find(function(d){return d.id===id});if(!x)return;
 if(t.dataset.a==='t')db.collection('pases').doc(id).update({presente:!x.presente,hora:x.presente?'':now()}).catch(function(e){alert('No se pudo: '+e.code)});
 if(t.dataset.a==='c'){var u=location.origin+location.pathname.replace('admin.html','pase.html')+'?c='+id;try{await navigator.clipboard.writeText(u);alert('Link copiado')}catch(_){prompt('Copia el link:',u)}}
 if(t.dataset.a==='x'&&confirm('¿Borrar a '+x.nombre+'?')){var b=db.batch();b.delete(db.collection('pases').doc(id));b.delete(db.collection('dni').doc(x.h));b.commit().catch(function(e){alert('No se pudo: '+e.code)})}});
</script></body></html>
